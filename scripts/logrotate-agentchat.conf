# AgentChat 后端日志轮转配置
#
# 安装（需管理员权限）：
#   sudo cp scripts/logrotate-agentchat.conf /etc/logrotate.d/agentchat
#   sudo logrotate -d /etc/logrotate.d/agentchat   # 干跑，检查语法
#   sudo logrotate -f /etc/logrotate.d/agentchat   # 立即执行一次验证
#
# 说明：
#   - 用 copytruncate：uvicorn 持有日志 fd 且不响应信号重开日志，
#     必须先复制再截断（比 create 更安全，不会丢 write 目标）
#   - size + daily 双条件：日志疯涨时按大小切，平时每天切一次
#   - su 段：以服务运行者身份执行，避免 logrotate 以 root 轮转后
#     出现属主变更、应用无权限写入的问题

/media/cmbsysadmin/E盘/02-Code/agentchat/logs/backend.log {
    daily
    size 100M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su cmbsysadmin cmbsysadmin
}
